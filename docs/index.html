<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alarms — interactive prototype</title>
<meta name="description" content="Interactive prototype of Alarms, an alarm clock that puts every alarm on one week grid.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Ccircle cx=%2220%22 cy=%2222%22 r=%2214%22 fill=%22%23E43BC6%22/%3E%3Ccircle cx=%2220%22 cy=%2222%22 r=%2210%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
<style>
  :root { --bg: #0E0C14; --ink: #F6ECF8; --muted: #B396C0; --line: rgba(255,255,255,0.14); --on: #F23FE4; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #F4EEF7; --ink: #241530; --muted: #6E5A7A; --line: rgba(36,21,48,0.16); --on: #B4179F; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Outfit, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
  header { width: 100%; max-width: 900px; padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  h1 span { color: var(--muted); font-weight: 400; }
  nav { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
  nav button { font: inherit; font-size: 14px; font-weight: 500; min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--on); color: #fff; }
  main { flex: 1 1 auto; width: 100%; display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 4px 0 16px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  figcaption { font-size: 13px; color: var(--muted); }
  .frame { position: relative; overflow: hidden; border-radius: 28px; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,0.35); }
  .stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; }
  .status { padding: 24px; color: var(--muted); font-size: 14px; }
  /* Side by side when there is room, otherwise one screen at a time. */
  body.single figure:not(.active) { display: none; }
  body:not(.single) nav { display: none; }
  body.single figcaption { display: none; }
  body.phone header { padding: 6px 12px; flex-wrap: nowrap; }
  body.phone nav button { min-height: 32px; padding: 0 10px; font-size: 13px; }
  body.phone h1 { font-size: 15px; }
  body.phone main { padding: 0; }
  body.phone .frame { border-radius: 0; box-shadow: none; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<header>
  <h1>Alarms <span>· interactive prototype</span></h1>
  <nav aria-label="Screen">
    <button type="button" data-show="main" aria-pressed="true">Week grid</button>
    <button type="button" data-show="ring" aria-pressed="false">Ringing</button>
  </nav>
</header>
<main>
  <figure id="main" class="active">
    <div class="frame"><div class="stage"><p class="status">Loading…</p></div></div>
    <figcaption>Tap the grid to add an alarm, drag to adjust</figcaption>
  </figure>
  <figure id="ring">
    <div class="frame"><div class="stage"><p class="status">Loading…</p></div></div>
    <figcaption>Alarm ringing: swipe to dismiss</figcaption>
  </figure>
</main>
<script>
  const W = 390, H = 844;
  const params = new URLSearchParams(location.search);
  const figs = [...document.querySelectorAll('figure')];
  // ?screen=ring opens the ringing screen; ?view=intro|empty|… picks the prototype's starting state.
  let shown = params.get('screen') === 'ring' ? 'ring' : 'main';

  function show(id) {
    shown = id;
    figs.forEach((f) => f.classList.toggle('active', f.id === id));
    document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.show === id)));
  }
  document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => show(b.dataset.show)));

  function layout() {
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    const phone = vw < 520;
    document.body.classList.toggle('phone', phone);
    const both = !phone && vw >= 2 * W * 0.6 + 120 && vh >= 560;
    document.body.classList.toggle('single', !both);
    const headerH = document.querySelector('header').offsetHeight;
    const capH = both ? 34 : 0;
    const availH = vh - headerH - capH - (phone ? 0 : 24);
    const availW = both ? (vw - 120) / 2 : vw - (phone ? 0 : 32);
    const s = phone ? Math.min(vw / W, (vh - headerH) / H) : Math.min(1, availH / H, availW / W);
    figs.forEach((f) => {
      const frame = f.querySelector('.frame');
      frame.style.width = W * s + 'px';
      frame.style.height = H * s + 'px';
      f.querySelector('.stage').style.transform = 'scale(' + s + ')';
    });
  }
  window.addEventListener('resize', layout);
  show(shown);
  layout();
  if (document.fonts) document.fonts.ready.then(layout);

  const view = params.get('view');
  const props = view ? { startView: view } : {};
  DCLite.mount(document.querySelector('#main .stage'), 'prototype/Main.dc.html', props)
    .catch((e) => { document.querySelector('#main .stage').innerHTML = '<p class="status"></p>'; document.querySelector('#main .status').textContent = e.message; });
  DCLite.mount(document.querySelector('#ring .stage'), 'prototype/Ring.dc.html', {})
    .catch((e) => { document.querySelector('#ring .stage').innerHTML = '<p class="status"></p>'; document.querySelector('#ring .status').textContent = e.message; });
</script>
</body>
</html>
